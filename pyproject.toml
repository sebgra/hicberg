[project]
name = "hicberg"
dynamic = ["version"]
description = "Hicberg: Rescuing of multi-mapping reads in Hi-C maps (and other pair ended omics) using statistical learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sébastien Gradit", email = "sebastien.gradit@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# These are your Python-specific dependencies (managed by uv/pip)
dependencies = [
    "click>=8.1.7",
    "pysam>=0.22.0",
    "cooler>=0.9.3",
    "biopython>=1.83",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.1",
    "bioframe>=0.6.1",
    "hicstuff>=3.2.2",
    "h5py>=3.10.0",
    "scikit-learn>=1.4.0",
    "funcy>=2.0",
]

[project.urls]
Homepage = "https://github.com/sebgra/hicberg"
Repository = "https://github.com/sebgra/hicberg.git"

[project.scripts]
hicberg = "hicberg.cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "hicberg.version.__version__"}

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# UV Specific configuration
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
]